name: Workgraph exact receipt selective CI work selection

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PRODUCER_REPOSITORY: kimjooyoon/gooo-evidence-generator
      PRODUCER_TAG: v0.5.0-dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SUBJECT_SHA }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Bind subject and capture read-only repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(go version | awk '{print $3}')" = go1.27.0
          work="$RUNNER_TEMP/selective-ci-work-selection"
          mkdir -p "$work"
          find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f -print0 |
            sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}' > "$work/repository-before"

      - name: Acquire one released receipt and released Gooo toolchain
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/selective-ci-work-selection"
          lock=contracts/test-receipt-reuse-release-lock-v1.json
          release="$work/release"
          corpus="$work/released"
          toolchain="$work/toolchain"
          mkdir -p "$release" "$corpus" "$toolchain"

          producer_repository=$(jq -r .producer.repository "$lock")
          producer_tag=$(jq -r .producer.tag "$lock")
          release_id=$(jq -r .producer.release_id "$lock")
          test "$producer_repository" = "$PRODUCER_REPOSITORY"
          test "$producer_tag" = "$PRODUCER_TAG"
          gh api "repos/$producer_repository/releases/$release_id" > "$release/producer-release.json"

          bundle_id=$(jq -r .producer.bundle.id "$lock")
          bundle_name=$(jq -r .producer.bundle.name "$lock")
          bundle_size=$(jq -r .producer.bundle.size "$lock")
          bundle_digest=$(jq -r .producer.bundle.digest "$lock")
          checksum_id=$(jq -r .producer.checksums.id "$lock")
          checksum_name=$(jq -r .producer.checksums.name "$lock")
          checksum_size=$(jq -r .producer.checksums.size "$lock")
          checksum_digest=$(jq -r .producer.checksums.digest "$lock")
          jq -e --arg tag "$producer_tag" --argjson id "$release_id" \
            '.id==$id and .tag_name==$tag and .draft==false and .prerelease==true' \
            "$release/producer-release.json" >/dev/null
          jq -e --arg name "$bundle_name" --arg digest "$bundle_digest" --argjson id "$bundle_id" --argjson size "$bundle_size" \
            '[.assets[]|select(.name==$name and .id==$id and .size==$size and .digest==$digest)]|length==1' \
            "$release/producer-release.json" >/dev/null
          jq -e --arg name "$checksum_name" --arg digest "$checksum_digest" --argjson id "$checksum_id" --argjson size "$checksum_size" \
            '[.assets[]|select(.name==$name and .id==$id and .size==$size and .digest==$digest)]|length==1' \
            "$release/producer-release.json" >/dev/null
          gh api -H 'Accept: application/octet-stream' "repos/$producer_repository/releases/assets/$bundle_id" > "$release/$bundle_name"
          gh api -H 'Accept: application/octet-stream' "repos/$producer_repository/releases/assets/$checksum_id" > "$release/$checksum_name"
          test "$(wc -c < "$release/$bundle_name" | tr -d ' ')" -eq "$bundle_size"
          test "$(wc -c < "$release/$checksum_name" | tr -d ' ')" -eq "$checksum_size"
          test "sha256:$(sha256sum "$release/$bundle_name" | awk '{print $1}')" = "$bundle_digest"
          test "sha256:$(sha256sum "$release/$checksum_name" | awk '{print $1}')" = "$checksum_digest"
          (cd "$release" && sha256sum -c "$checksum_name")
          test "$(unzip -Z1 "$release/$bundle_name" | wc -l | tr -d ' ')" -eq 44
          unzip -q "$release/$bundle_name" -d "$corpus"
          test "$(find "$corpus" -type f | wc -l | tr -d ' ')" -eq 44
          test -f "$corpus/baseline-test-receipt.json"
          test -f "$corpus/baseline-test-result.json"

          gooo_repository=$(jq -r .gooo.repository "$lock")
          gooo_release_id=$(jq -r .gooo.release_id "$lock")
          gooo_asset_id=$(jq -r .gooo.asset.id "$lock")
          gooo_asset_name=$(jq -r .gooo.asset.name "$lock")
          gooo_asset_size=$(jq -r .gooo.asset.size "$lock")
          gooo_asset_digest=$(jq -r .gooo.asset.digest "$lock")
          gh api "repos/$gooo_repository/releases/$gooo_release_id" > "$release/gooo-release.json"
          jq -e --arg name "$gooo_asset_name" --arg digest "$gooo_asset_digest" --argjson id "$gooo_asset_id" --argjson size "$gooo_asset_size" \
            '[.assets[]|select(.name==$name and .id==$id and .size==$size and .digest==$digest)]|length==1' \
            "$release/gooo-release.json" >/dev/null
          gh api -H 'Accept: application/octet-stream' "repos/$gooo_repository/releases/assets/$gooo_asset_id" > "$release/$gooo_asset_name"
          test "$(wc -c < "$release/$gooo_asset_name" | tr -d ' ')" -eq "$gooo_asset_size"
          test "sha256:$(sha256sum "$release/$gooo_asset_name" | awk '{print $1}')" = "$gooo_asset_digest"
          tar -xzf "$release/$gooo_asset_name" -C "$toolchain"
          chmod +x "$toolchain/gooo"
          test "$(sha256sum "$toolchain/gooo" | awk '{print $1}')" = "$(jq -r .gooo.observed_binary_sha256 "$lock")"

          jq -S -n --arg subject "$SUBJECT_SHA" --arg producer "$producer_repository" --arg tag "$producer_tag" \
            --arg bundle "$bundle_name" --arg bundle_digest "$bundle_digest" --argjson bundle_files 44 \
            --arg gooo "$gooo_repository" --arg gooo_asset "$gooo_asset_name" --arg gooo_digest "$gooo_asset_digest" \
            '{schema:"gooo/workgraph/selective-ci-work-selection-acquisition/v1",subject_sha:$subject,
              released_receipt:{repository:$producer,tag:$tag,bundle:$bundle,bundle_digest:$bundle_digest,files:$bundle_files,
                receipt:"baseline-test-receipt.json",result:"baseline-test-result.json"},
              released_gooo:{repository:$gooo,asset:$gooo_asset,asset_digest:$gooo_digest}}' > "$work/acquisition.json"

      - name: Bind twelve released-Gooo meta activities and execute fixture test
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/selective-ci-work-selection"
          binary="$work/toolchain/gooo"
          source=examples/selective-ci-work-selection/main.gooo
          denominator=contracts/selective-ci-work-selection-denominator-v1.json
          "$binary" version --json > "$work/version.json"
          "$binary" check --semantic --json "$source" > "$work/semantic.json"
          "$binary" graph dump "$source" > "$work/graph.json"
          jq -e '.schema_version=="gooo-version/v1" and .language=="gooo" and .version=="0.2.0-dev"' "$work/version.json" >/dev/null
          jq -e '.schema_version=="gooo/diagnostics/v1" and .command=="check" and .status=="ok" and .diagnostics==[] and .semantic_hash!=null' "$work/semantic.json" >/dev/null
          activities=$(jq -c '[.cells[].activity]' "$denominator")
          source_digest=$(sha256sum "$source" | awk '{print $1}')
          semantic_hash=$(jq -r .semantic_hash "$work/semantic.json")
          jq -e --arg source_digest "$source_digest" --arg semantic_hash "$semantic_hash" --argjson activities "$activities" \
            '.schema_version=="gooo-graph/v1" and .source_digest==$source_digest and .ir.status=="available" and .ir.semantic_digest==$semantic_hash and
             ([.nodes[]|select(.kind=="Activity")|.name]|sort)==($activities|sort) and ([.nodes[]|select(.kind=="Activity")]|length)==12' \
            "$work/graph.json" >/dev/null
          jq -S -n --arg source "$source" --arg source_digest "$source_digest" --arg semantic "$semantic_hash" --argjson activities "$activities" \
            '{schema:"gooo/workgraph/selective-ci-activity-resolution/v1",source:{file:$source,source_digest:$source_digest,semantic_digest:$semantic},
              summary:{expected:12,observed:12,closed:12,unknown:0,refuted:0,unique_selectors:12},
              entries:[$activities[]|{activity:.,selector:{name:.},receipt:{decision:"CLOSED",occurrences:1,matches:[{name:.,subject:{source_digest:$source_digest,semantic_digest:$semantic}}]}}]}' \
            > "$work/resolution.json"

      - name: Construct current scope and deterministic CI work input
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/selective-ci-work-selection"
          lock=contracts/test-receipt-reuse-release-lock-v1.json
          source=examples/test-receipt-reuse/main.gooo
          source_digest=$(sha256sum "$source" | awk '{print $1}')
          test "$source_digest" = "$(jq -r .subject.sha256 "$lock")"
          binary_digest=$(sha256sum "$work/toolchain/gooo" | awk '{print $1}')
          test "$binary_digest" = "$(jq -r .gooo.observed_binary_sha256 "$lock")"
          fixture_start_ns=$(date +%s%N)
          /usr/bin/time -v -o "$work/fixture-test-time.txt" "$work/toolchain/gooo" check --semantic --json "$source" > "$work/fixture-result.json"
          fixture_end_ns=$(date +%s%N)
          echo $(( (fixture_end_ns-fixture_start_ns+999999)/1000000 )) > "$work/test-wall-ms"
          scenario_descriptor=$(jq -S -n --arg test "released-gooo-semantic-test" --arg fixture "$source" \
            '{test:$test,fixture:$fixture,runner:"released-gooo",mode:"semantic-check"}')
          scenario_digest=$(printf '%s' "$scenario_descriptor" | sha256sum | awk '{print $1}')
          scope_id=$(jq -r .scope.id "$work/released/baseline-test-receipt.json")
          scope=$(jq -S -n --arg id "$scope_id" --arg source "$source" --arg source_digest "$source_digest" --arg toolchain_digest "$binary_digest" --arg scenario_digest "$scenario_digest" \
            --arg repository "$(jq -r .gooo.repository "$lock")" --arg tag "$(jq -r .gooo.tag "$lock")" \
            --arg commit "$(jq -r .gooo.target_commit_sha "$lock")" --arg binary "$binary_digest" \
            '{id:$id,input_digest:$source_digest,toolchain_digest:$toolchain_digest,scenario_digest:$scenario_digest,files:[{path:$source,sha256:$source_digest}],toolchain:{repository:$repository,tag:$tag,target_commit_sha:$commit,binary_sha256:$binary,platform:"linux-amd64"},command:["gooo","check","--semantic","--json",$source]}')
          jq -S -n --arg subject "$SUBJECT_SHA" --argjson scope "$scope" \
            '{schema:"gooo/workgraph/selective-ci-work-selection-input/v1",subject_sha:$subject,current_scope:$scope,
              tests:[{id:"released-gooo-semantic-test",required:true,scope:$scope,receipt_selector:"baseline-test-receipt.json"}]}' > "$work/selection-input.json"
          prior_receipt_digest=$(sha256sum "$work/released/baseline-test-receipt.json" | awk '{print $1}')
          result_digest=$(sha256sum "$work/fixture-result.json" | awk '{print $1}')
          semantic_hash=$(jq -r .semantic_hash "$work/fixture-result.json")
          test_wall_ms=$(cat "$work/test-wall-ms")
          test_peak_rss_kib=$(awk -F: '/Maximum resident set size/ {gsub(/ /,"",$2); print $2}' "$work/fixture-test-time.txt")
          test "$test_wall_ms" -gt 0
          test -n "$test_peak_rss_kib"
          jq -S -n --arg subject "$SUBJECT_SHA" --arg prior "$prior_receipt_digest" --argjson scope "$scope" \
            --arg digest "$result_digest" --arg semantic "$semantic_hash" --arg wall "$test_wall_ms" --arg rss "$test_peak_rss_kib" \
            '{schema:"gooo/workgraph/actual-test-execution-receipt/v1",subject_sha:$subject,
              prior_receipt:{schema:"gooo/evidence-generator/test-receipt/v1",sha256:$prior},
              execution:{test_executions:1},scope:$scope,
              result:{decision:"PASS",status:"ok",exit_code:0,diagnostics_schema:"gooo/diagnostics/v1",output_sha256:$digest,semantic_hash:$semantic},
              performance:{test_wall_ms:$wall,test_peak_rss_kib:$rss},
              authority:{repository_writes:0,source_mutations:0,local_test_executions:0,consumer_test_executions:0,cross_project_required_gates:0}}' > "$work/execution-receipt.json"
          jq -S -n --arg subject "$SUBJECT_SHA" --arg scenario_digest "$scenario_digest" --arg scenario "$scenario_descriptor" \
            '{schema:"gooo/workgraph/selective-ci-work-selection-runtime/v1",subject_sha:$subject,
              scenario:{digest:$scenario_digest,descriptor:$scenario},
              executions:{fixture_test_executions:1,consumer_test_executions:0,local_test_executions:0},
              authority:{repository_writes:0,local_test_executions:0,consumer_test_executions:0,cross_project_required_gates:0,producer_source_checkout:0,sibling_checkout_reads:0},
              toolchain:{go_required:"go1.27.0",selection_consumer:"released-gooo"}}' > "$work/runtime-base.json"

      - name: Evaluate fixed receipt-boundary scenarios and measure the evaluator
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/selective-ci-work-selection"
          lock=contracts/test-receipt-reuse-release-lock-v1.json
          denominator=contracts/selective-ci-work-selection-denominator-v1.json
          prior="$work/released/baseline-test-receipt.json"
          actual="$work/execution-receipt.json"
          result="$work/fixture-result.json"
          reports="$work/reports"
          mkdir -p "$reports/scenarios"
          zeros=$(printf '0%.0s' {1..64})
          jq --arg digest "$zeros" '.current_scope.input_digest=$digest | .current_scope.files[0].sha256=$digest | .tests[0].scope=.current_scope' \
            "$work/selection-input.json" > "$reports/scenarios/changed-input.json"
          jq --arg digest "$zeros" '.scope.scenario_digest=$digest' "$actual" > "$reports/scenarios/stale.json"
          jq --arg digest "$zeros" '.result.semantic_hash=$digest' "$actual" > "$reports/scenarios/digest-laundering.json"
          jq '.scope |= del(.scenario_digest) | .authority.cross_project_required_gates=1' "$actual" > "$reports/scenarios/mixed.json"
          jq '.authority.cross_project_required_gates=1' "$actual" > "$reports/scenarios/authority-escalation.json"
          jq '.result.decision="UNKNOWN"' "$actual" > "$reports/scenarios/unknown-decision.json"

          start_ns=$(date +%s%N)
          /usr/bin/time -v -o "$work/evaluator-time.txt" bash scripts/selective-ci-work-selection-report.sh \
            "$GITHUB_WORKSPACE" "$work/selection-input.json" "$lock" "$prior" "$actual" "$result" "$denominator" \
            "$work/graph.json" "$work/resolution.json" "$work/runtime-base.json" "$work/measurement" "$SUBJECT_SHA" normal
          end_ns=$(date +%s%N)
          wall_ms=$(( (end_ns-start_ns+999999)/1000000 ))
          peak_rss_kib=$(awk -F: '/Maximum resident set size/ {gsub(/ /,"",$2); print $2}' "$work/evaluator-time.txt")
          test "$wall_ms" -gt 0
          test -n "$peak_rss_kib"

          regular_files=$(find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f ! -path "$GITHUB_WORKSPACE/README.md" -print | wc -l | tr -d ' ')
          descendant_directories=$(find "$GITHUB_WORKSPACE" -mindepth 1 -type d ! -path "$GITHUB_WORKSPACE/.git" ! -path "$GITHUB_WORKSPACE/.git/*" -print | wc -l | tr -d ' ')
          physical_lines=$(find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f ! -path "$GITHUB_WORKSPACE/README.md" -print0 | sort -z | xargs -0 cat | wc -l | tr -d ' ')
          go_files=$(find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f -name '*.go' -print | wc -l | tr -d ' ')
          go_lines=$(find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f -name '*.go' -print0 | sort -z | xargs -0 cat | wc -l | tr -d ' ')
          gooo_files=$(find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f -name '*.gooo' -print | wc -l | tr -d ' ')
          gooo_lines=$(find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f -name '*.gooo' -print0 | sort -z | xargs -0 cat | wc -l | tr -d ' ')
          scenario_digest=$(jq -r .scenario.digest "$work/runtime-base.json")
          scenario_descriptor=$(jq -r .scenario.descriptor "$work/runtime-base.json")
          jq -S -n --arg subject "$SUBJECT_SHA" --arg scenario_digest "$scenario_digest" --arg scenario_descriptor "$scenario_descriptor" \
            --argjson wall_ms "$wall_ms" --argjson peak_rss_kib "$peak_rss_kib" --arg test_wall_ms "$(cat "$work/test-wall-ms")" \
            --arg test_peak_rss_kib "$(awk -F: '/Maximum resident set size/ {gsub(/ /,"",$2); print $2}' "$work/fixture-test-time.txt")" \
            --argjson regular_files "$regular_files" --argjson descendant_directories "$descendant_directories" \
            --argjson physical_lines "$physical_lines" --argjson go_files "$go_files" --argjson go_lines "$go_lines" \
            --argjson gooo_files "$gooo_files" --argjson gooo_lines "$gooo_lines" \
            '{schema:"gooo/workgraph/selective-ci-work-selection-runtime/v1",subject_sha:$subject,
              scenario:{digest:$scenario_digest,descriptor:$scenario_descriptor},
              executions:{fixture_test_executions:1,consumer_test_executions:0,local_test_executions:0},
              authority:{repository_writes:0,local_test_executions:0,consumer_test_executions:0,cross_project_required_gates:0,producer_source_checkout:0,sibling_checkout_reads:0},
              toolchain:{go_required:"go1.27.0",selection_consumer:"released-gooo"},
              performance:{test_wall_ms:($test_wall_ms|tonumber),test_peak_rss_kib:($test_peak_rss_kib|tonumber),evaluator_wall_ms:$wall_ms,evaluator_peak_rss_kib:$peak_rss_kib},
              inventory:{root_readme_policy:"EXCLUDED",regular_files:$regular_files,descendant_directories:$descendant_directories,physical_lines:$physical_lines,go:{files:$go_files,lines:$go_lines},gooo:{files:$gooo_files,lines:$gooo_lines}}}' > "$work/runtime.json"

          evaluate() {
            local name=$1
            local input=$2
            local actual_path=$3
            local report_scenario=$4
            bash scripts/selective-ci-work-selection-report.sh "$GITHUB_WORKSPACE" "$input" "$lock" "$prior" "$actual_path" "$result" \
              "$denominator" "$work/graph.json" "$work/resolution.json" "$work/runtime.json" "$reports/$name" "$SUBJECT_SHA" "$report_scenario"
          }
          evaluate normal "$work/selection-input.json" "$actual" normal
          evaluate normal-replay "$work/selection-input.json" "$actual" normal
          cmp -s "$reports/normal/report.json" "$reports/normal-replay/report.json"
          cmp -s "$reports/normal/ci-work-selection.json" "$reports/normal-replay/ci-work-selection.json"
          evaluate missing-receipt "$work/selection-input.json" "$work/missing-execution-receipt.json" missing-receipt
          evaluate stale "$work/selection-input.json" "$reports/scenarios/stale.json" stale
          evaluate changed-input "$reports/scenarios/changed-input.json" "$actual" changed-input
          evaluate digest-laundering "$work/selection-input.json" "$reports/scenarios/digest-laundering.json" laundering
          evaluate mixed "$work/selection-input.json" "$reports/scenarios/mixed.json" mixed
          evaluate authority-escalation "$work/selection-input.json" "$reports/scenarios/authority-escalation.json" authority-escalation
          evaluate unknown-decision "$work/selection-input.json" "$reports/scenarios/unknown-decision.json" unknown-decision
          jq -S -n \
            --slurpfile normal "$reports/normal/report.json" \
            --slurpfile missing "$reports/missing-receipt/report.json" \
            --slurpfile stale "$reports/stale/report.json" \
            --slurpfile changed "$reports/changed-input/report.json" \
            --slurpfile laundering "$reports/digest-laundering/report.json" \
            --slurpfile mixed "$reports/mixed/report.json" \
            --slurpfile authority "$reports/authority-escalation/report.json" \
            --slurpfile unknown_decision "$reports/unknown-decision/report.json" \
            '[$normal[0],$missing[0],$stale[0],$changed[0],$laundering[0],$mixed[0],$authority[0],$unknown_decision[0]]' > "$work/cases.json"

          manifest_entries=$(
            find "$reports" -type f -print0 | sort -z |
              while IFS= read -r -d '' file; do
                relative=${file#"$work/"}
                jq -cn --arg path "$relative" --arg sha256 "$(sha256sum "$file" | awk '{print $1}')" \
                  --argjson size_bytes "$(wc -c < "$file" | tr -d ' ')" \
                  '{path:$path,sha256:$sha256,size_bytes:$size_bytes}'
              done | jq -s .
          )
          jq -S -n --arg subject "$SUBJECT_SHA" --arg report "reports/normal/report.json" --arg execution_receipt "execution-receipt.json" \
            --arg work_selection "reports/normal/ci-work-selection.json" --arg dossier "human-dossier.md" \
            --argjson files "$manifest_entries" --slurpfile normal "$reports/normal/report.json" \
            --slurpfile cases "$work/cases.json" \
            '{schema:"gooo/workgraph/selective-ci-work-selection-manifest/v1",subject_sha:$subject,
              report:$report,execution_receipt:$execution_receipt,work_selection:$work_selection,human_dossier:$dossier,
              performance:$normal[0].performance,inventory:$normal[0].inventory,
              scenarios:[$cases[0][].scenario],files:$files}' > "$work/manifest.json"
          {
            echo '# Selective CI actual receipt and already-tested boundary dossier'
            echo
            jq -r '"- report: reports/normal/report.json",
              "- manifest: manifest.json",
              "- decision: \(.decision)",
              "- selection: \(.selection.action)",
              "- test_wall_ms: \(.performance.test_wall_ms)",
              "- test_peak_rss_kib: \(.performance.test_peak_rss_kib)",
              "- evaluator_wall_ms: \(.performance.evaluator_wall_ms)",
              "- evaluator_peak_rss_kib: \(.performance.evaluator_peak_rss_kib)",
              "- inventory: \(.inventory.regular_files) regular files; \(.inventory.descendant_directories) descendant directories; \(.inventory.physical_lines) physical lines",
              "- Go: \(.inventory.go.files) files / \(.inventory.go.lines) lines; Gooo: \(.inventory.gooo.files) files / \(.inventory.gooo.lines) lines",
              "- root README policy: \(.inventory.root_readme_policy)",
              "- Go version: \(.toolchain.go_required)",
              "- authority: repository_writes=\(.authority.repository_writes), local_test_executions=\(.authority.local_test_executions), cross_project_required_gates=\(.authority.cross_project_required_gates)"' "$reports/normal/report.json"
            echo
            echo '## Cases'
            jq -r '.[]|"- \(.scenario): \(.summary.closed) CLOSED / \(.summary.unknown) UNKNOWN / \(.summary.refuted) REFUTED; planned=\(.metrics.tests_planned); executed=\(.metrics.tests_executed); reused=\(.metrics.tests_reused); invalidated=\(.metrics.tests_invalidated); required=\(.metrics.tests_required_to_execute); action=\(.selection.action); reason=\(.selection.reason)"' "$work/cases.json"
          } > "$work/human-dossier.md"

      - name: Stage raw selection evidence before assertions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/selective-ci-work-selection"
          artifact="$work/artifact"
          mkdir -p "$artifact"
          for file in "$work"/acquisition.json "$work"/selection-input.json "$work"/runtime.json "$work"/cases.json "$work"/manifest.json "$work"/human-dossier.md "$work"/version.json "$work"/semantic.json "$work"/fixture-result.json "$work"/graph.json "$work"/resolution.json "$work"/execution-receipt.json; do
            test -f "$file" && cp "$file" "$artifact/"
          done
          if test -d "$work/reports"; then cp -R "$work/reports" "$artifact/reports"; fi
          if test -d "$work/released"; then
            mkdir -p "$artifact/released"
            for file in "$work"/released/baseline-test-receipt.json "$work"/released/baseline-test-result.json; do
              test -f "$file" && cp "$file" "$artifact/released/"
            done
          fi
          artifact_file_count=$(( $(find "$artifact" -type f | wc -l | tr -d ' ') + 1 ))
          runtime_inventory=$(jq -c .inventory "$work/runtime.json")
          echo "- artifact file count: $artifact_file_count" >> "$work/human-dossier.md"
          cp "$work/human-dossier.md" "$artifact/human-dossier.md"
          jq -S -n --arg subject "$SUBJECT_SHA" --arg name "workgraph-selective-ci-work-selection-$SUBJECT_SHA" --arg go_version "go1.27.0" --argjson file_count "$artifact_file_count" --argjson inventory "$runtime_inventory" \
            '{schema:"gooo/workgraph/selective-ci-work-selection-artifact/v2",subject_sha:$subject,
              reports:["normal","normal-replay","missing-receipt","stale","changed-input","digest-laundering","mixed","authority-escalation","unknown-decision"],
              manifest:"manifest.json",execution_receipt:"execution-receipt.json",human_dossier:"human-dossier.md",file_count:$file_count,artifact_name:$name,go_version:$go_version,inventory:$inventory,
              repository_writes:0,local_test_executions:0,cross_project_required_gates:0}' > "$artifact/artifact-metadata.json"

      - name: Assert fixed denominator, actual execution receipt, fail-closed reuse, and typed metrics
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/selective-ci-work-selection"
          jq -e '
            length==8 and
            all(.[];
              .summary.total==12 and (.summary.closed+.summary.unknown+.summary.refuted)==12 and
              ([.cells[]]|length)==12 and
              all(.cells[]; has("stage") and has("step") and has("reason") and has("unknown_class") and has("next_operation") and has("blocked_by") and
                (if .state=="UNKNOWN" then .stage!=null and .step!=null and .reason!=null and .unknown_class!=null and .next_operation!=null and .blocked_by!=null
                 elif .state=="REFUTED" then .stage!=null and .step!=null and .reason!=null and .unknown_class==null and .next_operation!=null and .blocked_by!=null
                 else true end)) and
              all([.metrics.tests_planned,.metrics.tests_executed,.metrics.tests_reused,.metrics.tests_invalidated,.metrics.tests_required_to_execute,.metrics.producer_test_executions_observed,.metrics.consumer_test_executions,.metrics.saved_test_ms][]; type=="number" or .=="UNKNOWN") and
              all([.performance.test_wall_ms,.performance.test_peak_rss_kib,.performance.evaluator_wall_ms,.performance.evaluator_peak_rss_kib][]; type=="number") and
              .inventory.root_readme_policy=="EXCLUDED" and
              all([.inventory.regular_files,.inventory.descendant_directories,.inventory.physical_lines,.inventory.go.files,.inventory.go.lines,.inventory.gooo.files,.inventory.gooo.lines][]; type=="number") and
              .meta_binding.verified and (.causal_frontier.minimum|length)>=0 and
              (.summary.refuted==0 or .claim.state=="REFUTED")) and
            (map(select(.scenario=="normal"))[0].decision=="ALREADY_TESTED_REUSE_READY") and
            (map(select(.scenario=="normal"))[0].selection.action=="REUSE") and
            (map(select(.scenario=="normal"))[0].metrics.tests_planned==1) and
            (map(select(.scenario=="normal"))[0].metrics.tests_executed==1) and
            (map(select(.scenario=="normal"))[0].metrics.tests_reused==1) and
            (map(select(.scenario=="normal"))[0].metrics.tests_invalidated==0) and
            (map(select(.scenario=="normal"))[0].metrics.tests_required_to_execute==0) and
            (map(select(.scenario=="normal"))[0].metrics.saved_test_ms=="UNKNOWN") and
            (map(select(.scenario=="missing-receipt"))[0].claim.state=="UNKNOWN") and
            (map(select(.scenario=="missing-receipt"))[0].metrics.tests_executed=="UNKNOWN") and
            (map(select(.scenario=="missing-receipt"))[0].metrics.tests_required_to_execute==1) and
            (map(select(.scenario=="stale"))[0].selection.reason=="SCENARIO_DIGEST_MISMATCH") and
            (map(select(.scenario=="stale"))[0].claim.state=="REFUTED") and
            (map(select(.scenario=="changed-input"))[0].selection.reason=="IMMUTABLE_INPUT_DIGEST_MISMATCH") and
            (map(select(.scenario=="changed-input"))[0].claim.state=="REFUTED") and
            (map(select(.scenario=="digest-laundering"))[0].selection.reason=="DIGEST_VALID_SEMANTIC_LAUNDERING") and
            (map(select(.scenario=="digest-laundering"))[0].claim.state=="REFUTED") and
            (map(select(.scenario=="mixed"))[0].claim.state=="REFUTED") and
            (map(select(.scenario=="mixed"))[0].summary.unknown>0) and
            (map(select(.scenario=="mixed"))[0].summary.refuted>0) and
            (map(select(.scenario=="authority-escalation"))[0].selection.reason=="EXECUTION_RECEIPT_AUTHORITY_ESCALATED") and
            (map(select(.scenario=="authority-escalation"))[0].claim.state=="REFUTED") and
            (map(select(.scenario=="unknown-decision"))[0].selection.reason=="UNKNOWN_RECEIPT_DECISION") and
            (map(select(.scenario=="unknown-decision"))[0].claim.state=="UNKNOWN")
          ' "$work/cases.json" >/dev/null
          jq -e 'all(.[]; .authority.repository_writes==0 and .authority.local_test_executions==0 and .authority.consumer_test_executions==0) and
            all(map(select(.scenario!="authority-escalation" and .scenario!="mixed")); .authority.cross_project_required_gates==0) and
            (map(select(.scenario=="mixed"))[0].authority.cross_project_required_gates==1) and
            (map(select(.scenario=="authority-escalation"))[0].authority.cross_project_required_gates==1)' "$work/cases.json" >/dev/null
          jq -e --slurpfile normal "$work/reports/normal/report.json" --slurpfile cases "$work/cases.json" '
            .schema=="gooo/workgraph/selective-ci-work-selection-manifest/v1" and
            .subject_sha==$normal[0].subject_sha and .report=="reports/normal/report.json" and .execution_receipt=="execution-receipt.json" and
            .work_selection=="reports/normal/ci-work-selection.json" and .human_dossier=="human-dossier.md" and
            .performance==$normal[0].performance and .inventory==$normal[0].inventory and
            .scenarios==[$cases[0][].scenario] and (.files|length)>0
          ' "$work/manifest.json" >/dev/null
          test -f "$work/human-dossier.md"
          grep -Eq 'evaluator_wall_ms|evaluator_peak_rss_kib|regular files|Go:|Gooo:' "$work/human-dossier.md"
          jq -e '.schema=="gooo/workgraph/selective-ci-work-selection-artifact/v2" and .file_count>0 and .manifest=="manifest.json" and .execution_receipt=="execution-receipt.json" and .human_dossier=="human-dossier.md" and .go_version=="go1.27.0" and .repository_writes==0 and .local_test_executions==0 and .cross_project_required_gates==0' "$work/artifact/artifact-metadata.json" >/dev/null

      - name: Publish selection summary
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/selective-ci-work-selection"
          {
            echo '## Workgraph actual test receipt and already-tested work selection'
            echo
            jq -r '.[]|"- \(.scenario): \(.decision); action=\(.selection.action); planned=\(.metrics.tests_planned); executed=\(.metrics.tests_executed); reused=\(.metrics.tests_reused); invalidated=\(.metrics.tests_invalidated); required=\(.metrics.tests_required_to_execute); test_wall_ms=\(.performance.test_wall_ms); test_peak_rss_kib=\(.performance.test_peak_rss_kib); reason=\(.selection.reason)"' "$work/cases.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce zero Workgraph repository writes
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/selective-ci-work-selection"
          find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f -print0 |
            sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}' > "$work/repository-after"
          test "$(cat "$work/repository-before")" = "$(cat "$work/repository-after")"

      - name: Upload selective-CI evidence
        if: always()
        id: evidence
        uses: actions/upload-artifact@v6
        with:
          name: workgraph-selective-ci-work-selection-${{ env.SUBJECT_SHA }}
          if-no-files-found: error
          path: ${{ runner.temp }}/selective-ci-work-selection/artifact

      - name: Publish artifact identity
        if: always()
        run: |
          {
            echo
            echo '### Evidence artifact'
            echo "- name: workgraph-selective-ci-work-selection-${{ env.SUBJECT_SHA }}"
            echo "- id: ${{ steps.evidence.outputs.artifact-id || 'unavailable' }}"
            echo "- digest: ${{ steps.evidence.outputs.artifact-digest || 'unavailable' }}"
            jq -r '"- file count: \(.file_count)","- Go version: \(.go_version)"' "$RUNNER_TEMP/selective-ci-work-selection/artifact/artifact-metadata.json"
          } >> "$GITHUB_STEP_SUMMARY"
